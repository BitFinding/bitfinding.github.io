<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#dedbd2" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#f5f3ed"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <style>
    .sans { font-family: "Helvetica Neue", Helvetica, sans-serif; fill: #171a18; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; fill: #171a18; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; }
    .title { font-size: 52px; font-weight: 700; letter-spacing: -1.6px; }
    .subtitle { font-size: 22px; fill: #676b67; }
    .label { font-size: 15px; font-weight: 700; letter-spacing: 1.2px; }
    .body { font-size: 18px; }
    .small { font-size: 14px; }
    .muted { fill: #747873; }
    .white { fill: #fffdf8; }
    .red { fill: #c94138; }
    .green { fill: #177d4a; }
    .blue { fill: #3f5faa; }
    .orange { fill: #b87018; }
  </style>

  <text x="70" y="45" class="mono eyebrow">LEDGER CLEAR SIGNING BYPASS / EXPLOIT MECHANICS / 01</text>
  <text x="1530" y="45" text-anchor="end" class="mono eyebrow red">FIXED IN ETHEREUM APP 1.22.3</text>
  <line x1="70" y1="64" x2="1530" y2="64" stroke="#bbb8b0"/>

  <text x="70" y="135" class="sans title">Two tuple bodies fit. 257 do not.</text>
  <text x="70" y="178" class="sans subtitle">Both encodings describe 257 logical calls. Only one fits the parser's 16 KiB allocation.</text>

  <text x="110" y="260" class="mono label muted">SAME BYTE SCALE</text>
  <line x1="110" y1="296" x2="1490" y2="296" stroke="#999c98" stroke-width="2"/>
  <line x1="110" y1="288" x2="110" y2="304" stroke="#575b57" stroke-width="2"/>
  <line x1="453" y1="275" x2="453" y2="585" stroke="#171a18" stroke-width="3"/>
  <line x1="1490" y1="288" x2="1490" y2="304" stroke="#575b57" stroke-width="2"/>
  <text x="110" y="325" text-anchor="middle" class="mono small muted">0 B</text>
  <text x="453" y="257" text-anchor="middle" class="mono label">16,384 B / HEAP LIMIT</text>
  <text x="1490" y="325" text-anchor="end" class="mono small muted">65,860 B</text>

  <text x="110" y="365" class="mono label">NAIVE ABI</text>
  <rect x="110" y="385" width="1380" height="74" rx="5" fill="#d4d1c9" stroke="#171a18" stroke-width="2"/>
  <rect x="110" y="385" width="174" height="74" rx="5" fill="#e5b15e"/>
  <rect x="284" y="385" width="1206" height="74" fill="#cf5148"/>
  <text x="197" y="417" text-anchor="middle" class="mono small">HEAD + OFFSETS</text>
  <text x="887" y="418" text-anchor="middle" class="mono body white" font-weight="700">257 PHYSICAL TUPLE BODIES</text>
  <text x="887" y="442" text-anchor="middle" class="mono small white">57,568 bytes</text>
  <text x="1490" y="478" text-anchor="end" class="mono label red">65,860 B / 4.02x THE HEAP</text>

  <text x="110" y="525" class="mono label">ALIASED ABI</text>
  <rect x="110" y="545" width="183" height="74" rx="5" fill="#d4d1c9" stroke="#171a18" stroke-width="2"/>
  <rect x="110" y="545" width="174" height="74" rx="5" fill="#e5b15e"/>
  <rect x="284" y="545" width="5" height="74" fill="#c94138"/>
  <rect x="289" y="545" width="4" height="74" rx="1" fill="#3f5faa"/>
  <line x1="293" y1="535" x2="293" y2="630" stroke="#177d4a" stroke-width="2"/>
  <text x="197" y="577" text-anchor="middle" class="mono small">HEAD + OFFSETS</text>
  <text x="307" y="591" class="mono label green">8,740 B / 53% OF HEAP</text>

  <text x="110" y="690" class="mono label muted">ALIASED ENCODING / EXPANDED VIEW</text>
  <rect x="110" y="715" width="54" height="72" rx="4" fill="#272b28"/>
  <rect x="170" y="715" width="95" height="72" rx="4" fill="#575d58"/>
  <rect x="271" y="715" width="95" height="72" rx="4" fill="#737872"/>
  <rect x="372" y="715" width="730" height="72" rx="4" fill="#e5b15e" stroke="#b87018"/>
  <rect x="1108" y="715" width="185" height="72" rx="4" fill="#cf5148"/>
  <rect x="1299" y="715" width="185" height="72" rx="4" fill="#4d6ec0"/>
  <text x="137" y="744" text-anchor="middle" class="mono small white">4 B</text>
  <text x="137" y="765" text-anchor="middle" class="mono small white">SEL</text>
  <text x="217" y="744" text-anchor="middle" class="mono small white">32 B</text>
  <text x="217" y="765" text-anchor="middle" class="mono small white">ROOT PTR</text>
  <text x="318" y="744" text-anchor="middle" class="mono small white">32 B</text>
  <text x="318" y="765" text-anchor="middle" class="mono small white">LEN=257</text>
  <text x="737" y="744" text-anchor="middle" class="mono body">257 x 32-BYTE OFFSETS</text>
  <text x="737" y="769" text-anchor="middle" class="mono small">8,224 B</text>
  <text x="1200" y="744" text-anchor="middle" class="mono body white">CALL_A</text>
  <text x="1200" y="769" text-anchor="middle" class="mono small white">224 B</text>
  <text x="1391" y="744" text-anchor="middle" class="mono body white">CALL_B</text>
  <text x="1391" y="769" text-anchor="middle" class="mono small white">224 B</text>

  <text x="70" y="855" class="mono small muted">68 B PREAMBLE + 8,224 B OFFSET TABLE + 448 B SHARED TUPLE DATA = 8,740 B</text>
  <text x="1530" y="855" text-anchor="end" class="mono small muted">BITFINDING SECURITY RESEARCH</text>
</svg>
