<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#dedbd2" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="darkArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#262a27"/>
    </marker>
    <marker id="redArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#c94138"/>
    </marker>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#3f5faa"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f5f3ed"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <style>
    .sans { font-family: "Helvetica Neue", Helvetica, sans-serif; fill: #171a18; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; fill: #171a18; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; }
    .title { font-size: 52px; font-weight: 700; letter-spacing: -1.6px; }
    .subtitle { font-size: 22px; fill: #676b67; }
    .label { font-size: 15px; font-weight: 700; letter-spacing: 1.2px; }
    .body { font-size: 18px; }
    .small { font-size: 14px; }
    .muted { fill: #747873; }
    .white { fill: #fffdf8; }
    .red { fill: #c94138; }
    .blue { fill: #3f5faa; }
    .green { fill: #177d4a; }
  </style>

  <text x="70" y="45" class="mono eyebrow">LEDGER CLEAR SIGNING BYPASS / EXPLOIT MECHANICS / 03</text>
  <text x="1530" y="45" text-anchor="end" class="mono eyebrow red">ONE PAYLOAD / TWO INTERPRETATIONS</text>
  <line x1="70" y1="64" x2="1530" y2="64" stroke="#bbb8b0"/>

  <text x="70" y="135" class="sans title">The screen reviews a suffix. The signature covers everything.</text>
  <text x="70" y="178" class="sans subtitle">The device and Safe consume the same 8,740 calldata bytes but disagree about how many entries matter.</text>

  <rect x="70" y="225" width="610" height="228" rx="8" fill="#edf1fa" stroke="#3f5faa" stroke-width="2"/>
  <text x="95" y="260" class="mono label blue">GTP / DEVICE REVIEW</text>
  <text x="95" y="302" class="mono body">array passes       257 / 0x0101</text>
  <text x="95" y="338" class="mono body">8-bit countdown    1 / 0x01</text>
  <text x="95" y="374" class="mono body">first index        257 - 1 = 256</text>
  <rect x="95" y="397" width="560" height="38" rx="4" fill="#3f5faa"/>
  <text x="115" y="422" class="mono label white">DISPLAY: SEND 10 USDC / CALLS[256]</text>

  <rect x="920" y="225" width="610" height="228" rx="8" fill="#fae9e6" stroke="#c94138" stroke-width="2"/>
  <text x="945" y="260" class="mono label red">SAFE / EVM EXECUTION</text>
  <text x="945" y="302" class="mono body">array length       257 / uint256</text>
  <text x="945" y="338" class="mono body">calls[0..255]      CALL_A</text>
  <text x="945" y="374" class="mono body">calls[256]         CALL_B</text>
  <rect x="945" y="397" width="560" height="38" rx="4" fill="#c94138"/>
  <text x="965" y="422" class="mono label white">EXECUTE: APPROVE x256, THEN TRANSFER</text>

  <path d="M 375 453 C 375 480, 1118 468, 1370 520" fill="none" stroke="#3f5faa" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <path d="M 1225 453 C 1225 480, 995 480, 970 520" fill="none" stroke="#c94138" stroke-width="2.5" marker-end="url(#redArrow)"/>

  <text x="70" y="528" class="mono label muted">THE SAME SIGNED CALLDATA</text>
  <rect x="70" y="550" width="62" height="76" rx="3" fill="#272b28"/>
  <rect x="138" y="550" width="96" height="76" rx="3" fill="#575d58"/>
  <rect x="240" y="550" width="96" height="76" rx="3" fill="#737872"/>
  <rect x="342" y="550" width="760" height="76" rx="3" fill="#e5b15e" stroke="#b87018"/>
  <rect x="1108" y="550" width="207" height="76" rx="3" fill="#cf5148"/>
  <rect x="1321" y="550" width="209" height="76" rx="3" fill="#4d6ec0"/>
  <text x="101" y="594" text-anchor="middle" class="mono small white">SEL</text>
  <text x="186" y="594" text-anchor="middle" class="mono small white">ROOT PTR</text>
  <text x="288" y="584" text-anchor="middle" class="mono small white">ARRAY</text>
  <text x="288" y="603" text-anchor="middle" class="mono small white">LEN 257</text>
  <text x="722" y="582" text-anchor="middle" class="mono body">PTR_A x 256</text>
  <text x="722" y="606" text-anchor="middle" class="mono small">+ FINAL PTR_B</text>
  <text x="1211" y="582" text-anchor="middle" class="mono body white">CALL_A</text>
  <text x="1211" y="606" text-anchor="middle" class="mono small white">HIDDEN</text>
  <text x="1425" y="582" text-anchor="middle" class="mono body white">CALL_B</text>
  <text x="1425" y="606" text-anchor="middle" class="mono small white">DISPLAYED</text>

  <line x1="70" y1="665" x2="1530" y2="665" stroke="#171a18" stroke-width="3"/>
  <line x1="70" y1="650" x2="70" y2="680" stroke="#171a18" stroke-width="3"/>
  <line x1="1530" y1="650" x2="1530" y2="680" stroke="#171a18" stroke-width="3"/>
  <text x="800" y="704" text-anchor="middle" class="mono label">calldataHash = keccak256(ALL 8,740 BYTES)</text>
  <path d="M 800 721 L 800 755" stroke="#171a18" stroke-width="2" marker-end="url(#darkArrow)"/>
  <rect x="385" y="765" width="830" height="62" rx="7" fill="#272b28"/>
  <text x="800" y="792" text-anchor="middle" class="mono label white">SafeTxHash = EIP712(..., dataHash = calldataHash, ...)</text>
  <text x="800" y="815" text-anchor="middle" class="mono small white">LEDGER SIGNATURE COMMITS TO HIDDEN CALL_A + DISPLAYED CALL_B</text>

  <text x="70" y="865" class="mono small muted">DISPLAY SCOPE != SIGNATURE SCOPE</text>
  <text x="1530" y="865" text-anchor="end" class="mono small muted">BITFINDING SECURITY RESEARCH</text>
</svg>
